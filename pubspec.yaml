name: app_san_ignacio
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.5.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  flutter_staggered_grid_view: ^0.7.0
  equatable: ^2.0.7
  flutter_bloc: ^9.1.0
  shared_preferences: ^2.5.3
  card_swiper: ^3.0.1
  carousel_slider: ^4.2.1
  smooth_page_indicator: ^1.2.1
  font_awesome_flutter: 10.8.0
  url_launcher: ^6.3.1
  flutter_tts: ^3.8.5
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.2
  google_sign_in: ^6.1.6
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  google_maps_flutter: ^2.14.0
  model_viewer_plus: ^1.9.2
  youtube_player_flutter: 9.1.2
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icons/
    - assets/images/categories/
    - assets/images/lugares/
    - assets/icons/
    - assets/icons/social_media/
    - assets/icons/navigator_icons/
    - assets/icons/button_icons/
    - assets/icons/account_icons/
    - assets/icons/others/
    - assets/fonts/gilroy/

  fonts:
    - family: Gilroy
      fonts:
        - asset: assets/fonts/gilroy/Gilroy-Regular.ttf
        - asset: assets/fonts/gilroy/Gilroy-SemiBold.ttf
        - asset: assets/fonts/gilroy/Gilroy-Bold.otf
